name: Publish Folio Chroma 1.4.1 at launch
on:
  workflow_dispatch:
  schedule:
    # Start ahead of 10:00 in Rome; verify the UTC deadline inside the job.
    - cron: '17,38 8 10 1 *'
    - cron: '2,17,42 9 10 1 *'
    - cron: '13 10,11,16,22 10 1 *'
permissions:
  contents: write
concurrency:
  group: publish-folio-chroma-1-4-1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify draft and open the release at launch
        run: python3 .github/scripts/publish-chroma.py
        env:
          GH_TOKEN: ${{ github.token }}

